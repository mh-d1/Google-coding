<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeFinder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1 class="logo">CodeFinder</h1>

    <div class="search-box">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Cari hal tentang coding..."
        oninput="showResults()"
      />
    </div>

    <div id="resultBox" class="results"></div>

    <div class="buttons">
      <button onclick="randomTopic()">Topik Acak</button>
      <button onclick="clearSearch()">Bersihkan</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
